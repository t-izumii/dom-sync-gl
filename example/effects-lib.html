<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>effectsLib — 動作テストページ</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        color: #fff;
        background-color: #101018;
        min-height: 100vh;
      }

      /* attach:'dom' の対象。ライブラリは position を上書きしないので
         CSS で fixed 全画面にする。canvas はこの box のサイズで生成される。 */
      #gl {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #gl canvas { display: block; }

      /* エフェクト切替ナビ + 現在のエフェクト表示（canvas より前面） */
      .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        max-width: min(320px, calc(100vw - 24px));
        font-family: ui-monospace, monospace;
        font-size: 13px;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 10px 12px;
        border-radius: 8px;
      }
      .panel__current { font-size: 15px; font-weight: 600; }
      .panel__hint { margin-top: 4px; color: rgba(255, 255, 255, 0.65); }
      .panel__nav { margin-top: 10px; }
      .panel__nav ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
      }
      .panel__nav a { color: rgba(255, 255, 255, 0.75); }
      .panel__nav a:hover,
      .panel__nav a:focus-visible { color: #fff; }
      .panel__nav a.is-active { color: #7fd4c1; }

      /* plane 系エフェクト（rippleFeedback / liquidSwap / stickerPeel）の同期先。
         WebGL の板がこの rect にロックされる。要素自体は透明で canvas を覗かせる。 */
      .demo-image {
        position: fixed;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        width: min(560px, 78vw);
        aspect-ratio: 4 / 3;
        z-index: 1;
        pointer-events: auto;
        outline: 1px dashed rgba(255, 255, 255, 0.25);
        outline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <!-- WebGPU canvas mount（装飾のみ。操作系は下の DOM ナビが担う） -->
    <div id="gl" aria-hidden="true"></div>

    <div class="panel">
      <p class="panel__current">effect: <span class="js-current-effect">-</span></p>
      <p class="panel__hint js-effect-hint"></p>
      <nav class="panel__nav js-effect-nav" aria-label="エフェクト切替">
        <ul>
          <li><a href="?effect=pixelTrail">pixelTrail</a></li>
          <li><a href="?effect=smoothCursor">smoothCursor</a></li>
          <li><a href="?effect=mouseFlow">mouseFlow</a></li>
          <li><a href="?effect=ditherCursor">ditherCursor</a></li>
          <li><a href="?effect=splashCursor">splashCursor</a></li>
          <li><a href="?effect=ripple">ripple</a></li>
          <li><a href="?effect=rippleFeedback">rippleFeedback</a></li>
          <li><a href="?effect=liquidSwap">liquidSwap</a></li>
          <li><a href="?effect=stickerPeel">stickerPeel</a></li>
        </ul>
      </nav>
    </div>

    <!-- plane 系エフェクトの同期先。post 系では JS が hidden のまま使わない -->
    <div class="demo-image js-demo-image" hidden></div>

    <script type="module" src="/src/effects-lib.ts"></script>
  </body>
</html>
