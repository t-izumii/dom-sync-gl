<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Effect — texture ⇄ post 切替</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0c0d12;
        color: #e8e6df;
        font-family: system-ui, sans-serif;
        min-height: 200vh; /* スクロール余地（scrollSync 確認用） */
        padding: 6rem 5vw;
        cursor: crosshair;
      }
      #gl { z-index: 0; }
      .head { position: relative; z-index: 2; max-width: 720px; }
      h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 600; letter-spacing: -0.02em; }
      p { margin-top: 1rem; color: #9b988f; line-height: 1.8; font-size: 0.95rem; }
      .toggle {
        position: fixed; top: 1.2rem; right: 1.2rem; z-index: 100;
        display: flex; align-items: center; gap: 0.75rem;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
        padding: 0.6rem 0.9rem; border-radius: 10px; backdrop-filter: blur(8px);
      }
      .toggle button {
        font: inherit; font-size: 0.85rem; padding: 0.4rem 0.9rem; border-radius: 7px;
        border: 1px solid rgba(255,255,255,0.18); background: #e8e6df; color: #14151a;
        cursor: pointer; font-weight: 600;
      }
      .toggle code { color: #ffcf6b; font-size: 0.85rem; }
      .grid {
        position: relative; z-index: 2; margin-top: 4rem;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 2rem;
      }
      .card {
        aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden;
        outline: 1px solid rgba(255,255,255,0.1); outline-offset: -1px;
      }
      .card__label {
        position: absolute; inset: auto 0 0 0; padding: 0.6rem 0.8rem;
        font-size: 0.8rem; color: rgba(255,255,255,0.7); pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="gl"></div>

    <div class="toggle">
      <span>output:</span>
      <code id="mode">texture</code>
      <button id="toggle">切替</button>
    </div>

    <div class="head">
      <h1>Unified Effect — 同じ effect クラスを texture ⇄ post で切替</h1>
      <p>
        同じ <code>Trail</code> クラス（<code>BaseEffect</code>）を、<code>addEffect(effect, { output })</code> の
        <code>output</code> だけで切り替えています。<br />
        <strong>texture</strong>: 軌跡テクスチャを plane material の uniform に供給（素材として統合）。
        <strong>post</strong>: 軌跡を描画結果に合成（発光オーバーレイ）。<br />
        カードの上にマウスを乗せて動かすと軌跡が出ます。右上のボタンで出力モードを切り替えてください。
      </p>
    </div>

    <div class="grid">
      <div class="card" data-seed="0"></div>
      <div class="card" data-seed="1"></div>
      <div class="card" data-seed="2"></div>
      <div class="card" data-seed="3"></div>
    </div>

    <script type="module" src="/src/unified-effect.ts"></script>
  </body>
</html>
